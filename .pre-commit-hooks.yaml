# pre-commit hook definitions for Trivy

---
# This manifest exposes multiple Trivy scanners as separate hook IDs.
# Each hook runs the official aquasec/trivy container to perform a
# security scan over different targets. The Trivy version is managed separately
# by installing it as a developer dependency. Consumers can extend
# behavior using `args:` in their own .pre-commit-config.yaml.

- id: trivy-fs
  name: Trivy filesystem
  language: system
  entry: trivy fs --cache-dir /src/.pre-commit-trivy-cache --no-progress --exit-code 1 .
  pass_filenames: false
  description: |
    Scan the contents of the repository's filesystem for vulnerabilities,
    secrets and license issues. This is useful to quickly check code
    projects or build artifacts on every commit. Additional scanners
    (e.g. misconfig or secret) can be enabled via `--scanners` passed
    through args in the consuming configuration.

- id: trivy-config
  name: Trivy IaC configuration
  language: system
  entry: trivy config --cache-dir /src/.pre-commit-trivy-cache --exit-code 1 .
  pass_filenames: false
  description: |
    Detect misconfigurations in infrastructure-as-code files such as
    Kubernetes manifests, Terraform configurations, Dockerfiles and
    more. Only the misconfiguration scanner is enabled by default; to
    add additional scanners, supply the `--scanners` flag via args.

- id: trivy-repo
  name: Trivy repository
  language: system
  entry: trivy repo --cache-dir /src/.pre-commit-trivy-cache --no-progress --exit-code 1 .
  pass_filenames: false
  description: |
    Perform an aggregated scan of the entire repository. This command
    combines vulnerability, misconfiguration, secret and license
    scanning in a single invocation. It can also be used to scan
    remote repositories by passing a URL via args. Due to its
    comprehensiveness it is recommended to run on push or manual
    stages rather than on every commit.

- id: trivy-image-registry
  name: Trivy container image (registry)
  language: system
  entry: trivy image --cache-dir /src/.pre-commit-trivy-cache --no-progress --exit-code 1
  pass_filenames: false
  description: |
    Scan a container image pulled from a registry. The image
    reference (e.g. alpine:3.20) must be supplied via args in the
    consuming configuration. This hook does not have access to the
    local Docker daemon.

- id: trivy-image-daemon
  name: Trivy container image (local daemon)
  language: system
  entry: bash -lc 'docker run --rm -v "$PWD":/src -v /var/run/docker.sock:/var/run/docker.sock trivy image --cache-dir /src/.pre-commit-trivy-cache --no-progress --exit-code 1 "$@"'
  pass_filenames: false
  description: |
    Scan a locally built container image by mounting the host's
    Docker socket into the Trivy container. This requires that
    Docker is installed and the current user has permissions to
    access /var/run/docker.sock. Use this hook sparingly, as it
    depends on host-specific state. The image name to scan should
    be passed via args.